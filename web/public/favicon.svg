<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- BrandMark geometry (components/ui/brandMark.tsx) with the outline color
       resolved per browser-chrome scheme: a standalone favicon has no
       surrounding ink to inherit via currentColor. -->
  <style>
    rect { stroke: #20301c; }
    @media (prefers-color-scheme: dark) { rect { stroke: #ede8d4; } }
  </style>
  <rect x="2" y="3" width="12" height="10" rx="2.5" fill="#E4572E" stroke-width="2"/>
  <rect x="10" y="11" width="12" height="10" rx="2.5" fill="#E4572E" stroke-width="2"/>
</svg>
