name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore PartyUp.sln

      - run: dotnet build PartyUp.sln --no-restore -warnaserror

      # Integration tests are included (Category=Integration, Testcontainers) — ubuntu-latest
      # runners ship Docker. Locally without Docker: dotnet test --filter Category!=Integration
      - run: dotnet test PartyUp.sln --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      # tsc -b && vite build — covers the typecheck gate and the production build in one step.
      - run: npm run build
      - run: npm test

  # A-082 (PHASE5_DESIGN.md §9, §12 S1 row): the dedicated CI browser + axe lane. `needs: dotnet`
  # only orders the jobs — a GitHub Actions job shares no filesystem or build output with another,
  # so this job builds and assembles the built topology itself rather than reusing the `dotnet` or
  # `web` job's output. Neither this job's steps nor any other job start the API process:
  # `PlaywrightFixture`'s built topology does that, against the `wwwroot` and built solution this
  # job hands it, and fails outright if that `wwwroot` is empty.
  browser:
    needs: dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # This job's own SPA build. `dotnet build` (unlike `dotnet publish`) does NOT copy a
      # project's wwwroot into its output directory, so the copy below runs AFTER the build,
      # straight into the build's own bin output — that is the physical directory
      # `PlaywrightFixture`'s built topology checks and the directory it sets as the API child
      # process's working directory (ASP.NET Core's default content root is the process's current
      # directory), which is what makes `Program.cs:357`'s `Path.Combine(ContentRootPath,
      # "wwwroot")` resolve to exactly what was copied here.
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - run: dotnet restore PartyUp.sln
      - run: dotnet build PartyUp.sln --no-restore -warnaserror

      - run: |
          mkdir -p src/PartyUp.Api/bin/Debug/net10.0/wwwroot
          cp -r web/dist/. src/PartyUp.Api/bin/Debug/net10.0/wwwroot/

      - name: Install pinned Playwright browsers (Chromium + WebKit)
        run: pwsh tests/PartyUp.BrowserTests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium webkit

      # F3 (round-1 fix): both steps log to trx inside the same `test-results` directory
      # `PlaywrightFixture.ArtifactsDirectory` also writes API stdout/stderr and Playwright traces
      # into, so the upload step below has one real directory covering every diagnostic a CI red
      # produces, not a path nothing is ever written to.
      - name: Chromium flows + axe
        env:
          PARTYUP_BROWSER_TOPOLOGY: built
        run: >
          dotnet test tests/PartyUp.BrowserTests --no-build -p:PartyUpBrowserTests=true
          --filter "Category=Integration&Browser!=WebKit"
          --logger trx --results-directory tests/PartyUp.BrowserTests/bin/Debug/net10.0/test-results

      - name: WebKit pointer lane
        env:
          PARTYUP_BROWSER_TOPOLOGY: built
        run: >
          dotnet test tests/PartyUp.BrowserTests --no-build -p:PartyUpBrowserTests=true
          --filter "Browser=WebKit"
          --logger trx --results-directory tests/PartyUp.BrowserTests/bin/Debug/net10.0/test-results

      - name: Upload axe/trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-lane-artifacts
          path: |
            tests/PartyUp.BrowserTests/bin/Debug/net10.0/axe-results/**
            tests/PartyUp.BrowserTests/bin/Debug/net10.0/test-results/**
          if-no-files-found: warn
